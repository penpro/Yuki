# Admin proxy. Installed to /etc/nginx/snippets/yuki-admin.conf by
# server-setup.sh ONLY when a real domain is configured, because a domain is
# the prerequisite for a certificate and the admin must not be reachable over
# plain HTTP.
#
# If you are reading this because the admin 404s: that is the safety working.
# Run ./deploy/server-setup.sh <domain> and then certbot.

location /admin {
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/snippets/yuki-proxy.conf;
    include /etc/nginx/snippets/yuki-security-headers.conf;
}

location /api/admin {
    proxy_pass http://127.0.0.1:3001;
    include /etc/nginx/snippets/yuki-proxy.conf;
    include /etc/nginx/snippets/yuki-security-headers.conf;
    # Uploads go through here; the app caps files at 8MB, so refuse anything
    # larger at the edge rather than streaming it into node first.
    client_max_body_size 10m;
}
