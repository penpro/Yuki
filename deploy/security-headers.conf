# Security headers for yukisacredspace.
#
# Kept in its own file and re-included inside EVERY location block that
# calls add_header. This is not redundancy — nginx's add_header inheritance
# REPLACES all parent add_header directives the moment a child location
# declares one of its own. Without re-including here, adding a Cache-Control
# to /assets/ would silently strip every security header from those
# responses. (Same trap documented in WebDevClass.)
#
# Verify after any change:
#   curl -sI https://DOMAIN/            | grep -i -E 'strict|content-sec|frame|nosniff'
#   curl -sI https://DOMAIN/assets/styles.css | grep -i -E 'strict|content-sec'
#   curl -sI https://DOMAIN/guides/breakup.html | grep -i content-security
#
# CSP notes for this site specifically:
#   script-src  'self' only — there is no inline JS anywhere. The workbook
#               toggle lives in assets/workbook.js precisely so this can
#               stay tight. Do not add 'unsafe-inline' here; if something
#               needs a script, give it a file.
#   style-src   needs 'unsafe-inline' for the inline style="--i:1" reveal
#               delays and the swatch chips on brand.html, plus
#               fonts.googleapis.com for the webfont CSS.
#   font-src    fonts.gstatic.com serves the actual font files.
#   img-src     data: covers the SVG grain texture baked into styles.css.
#   Outbound links (Square, Facebook, Medium, Venmo, Cash App) are
#   navigations, not subresources, so they need no CSP entry.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
