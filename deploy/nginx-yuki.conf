# nginx site config for Yūki's Sacred Space (static site).
#
# Install on the server via deploy/server-setup.sh, which copies this to
# /etc/nginx/sites-available/yuki and symlinks it into sites-enabled.
#
# This file is the PRE-certbot version: HTTP only, port 80. Running
# `sudo certbot --nginx -d DOMAIN` rewrites it in place to add the 443
# server block, the certificate paths, and the HTTP->HTTPS redirect.
# After certbot has run, edit the copy in /etc/nginx/sites-available/
# rather than this one, or re-run certbot after re-copying.
#
# Replace DOMAIN below (server-setup.sh does this for you).

server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN;
    root /var/www/yuki;
    index index.html;

    # ---- security headers (server scope) ----
    include /etc/nginx/snippets/yuki-security-headers.conf;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # Don't advertise the exact nginx version
    server_tokens off;

    # ---- pretty URLs -------------------------------------------------
    # /about  ->  /about.html, and a real 404 otherwise.
    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- dynamic resources page --------------------------------------
    # Rendered by node from MySQL. If node is down or the database is
    # unreachable we fall back to the deployed static file, which still
    # carries the seeded cards — a stale page beats a 502.
    location = /resources {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @resources_static;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }
    location = /resources.html { return 301 /resources; }
    location @resources_static {
        try_files /resources.html =404;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- analytics beacon ---------------------------------------------
    # Fire-and-forget. If node is down these must fail fast and silently
    # rather than stalling a page load, so no fallback and a tight timeout.
    location ~ ^/api/(hit|event)$ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;                 # would otherwise double-log every view
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- mailing list -------------------------------------------------
    # No static fallback on these: if node is down, a signup must fail
    # visibly rather than appear to succeed and be silently lost.
    location = /api/subscribe {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # Confirm and unsubscribe must work from a click in any mail client, so
    # they stay plain GETs with no auth. /unsubscribe also accepts POST for
    # the one-click header button Gmail and Outlook render.
    location = /confirm {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }
    location = /unsubscribe {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # Public read-only JSON for the testimonials block on the home page.
    location = /api/testimonials {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/yuki-proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @empty_json;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }
    location @empty_json {
        default_type application/json;
        return 200 '[]';
    }

    # ---- uploaded files ----------------------------------------------
    # Served read-only from outside the site root. `alias` (not `root`) so
    # nothing here can reach back into the deployed site.
    location /uploads/ {
        alias /var/www/yuki-uploads/;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/yuki-security-headers.conf;
        # Uploads are data, never executable. Force a download rather than
        # letting an uploaded .svg or .html run script in this origin.
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- admin (only present once HTTPS is configured) ---------------
    # server-setup.sh writes yuki-admin.conf ONLY when a real domain is
    # passed. With no domain the glob matches no files, nginx starts
    # cleanly, and the login page simply does not exist on the internet.
    # This is deliberate: a credential form on plain HTTP is worse than
    # no admin at all.
    include /etc/nginx/snippets/yuki-admin*.conf;

    # ---- long-cache the fingerprint-free static assets ---------------
    # These are plain filenames with no content hash, so cache for a day
    # rather than a year — long enough to help, short enough that a fix
    # to styles.css reaches people the next day without a hard refresh.
    # No `expires` directive here on purpose: it emits its own Cache-Control,
    # which lands alongside the add_header one and sends the header twice.
    #
    # "no-cache" does NOT mean don't cache — it means revalidate before use.
    # The browser sends If-None-Match and gets a 304 when nothing changed, so
    # the bandwidth cost is a few hundred bytes per asset.
    #
    # These filenames carry no content hash, so a long max-age meant a fixed
    # stylesheet or script took up to a day to reach anyone who had already
    # visited. On a site being actively worked on, shipping a fix that users
    # cannot receive is worse than an extra conditional request.
    location /assets/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # HTML should always revalidate so content edits go live immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- never serve these -------------------------------------------
    # Belt and braces: the deploy script doesn't copy them, but if one
    # ever lands in the web root by hand it still won't be downloadable.
    location ~* \.(pem|key|ppk|py|md|sh|json|xml)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Defence in depth. deploy.sh no longer copies backend/ into the web root,
    # but a stale copy from an older deploy — or anything restored by hand —
    # must not become downloadable source. Note .js is deliberately NOT in the
    # extension deny list above, because assets/main.js needs to be served,
    # which is exactly how backend/server.js was briefly readable.
    location ^~ /backend/ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/yuki.access.log;
    error_log  /var/log/nginx/yuki.error.log;
}
