# nginx site config for Yūki's Sacred Space (static site).
#
# Install on the server via deploy/server-setup.sh, which copies this to
# /etc/nginx/sites-available/yuki and symlinks it into sites-enabled.
#
# This file is the PRE-certbot version: HTTP only, port 80. Running
# `sudo certbot --nginx -d DOMAIN` rewrites it in place to add the 443
# server block, the certificate paths, and the HTTP->HTTPS redirect.
# After certbot has run, edit the copy in /etc/nginx/sites-available/
# rather than this one, or re-run certbot after re-copying.
#
# Replace DOMAIN below (server-setup.sh does this for you).

server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN;
    root /var/www/yuki;
    index index.html;

    # ---- security headers (server scope) ----
    include /etc/nginx/snippets/yuki-security-headers.conf;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # Don't advertise the exact nginx version
    server_tokens off;

    # ---- pretty URLs -------------------------------------------------
    # /about  ->  /about.html, and a real 404 otherwise.
    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- long-cache the fingerprint-free static assets ---------------
    # These are plain filenames with no content hash, so cache for a day
    # rather than a year — long enough to help, short enough that a fix
    # to styles.css reaches people the next day without a hard refresh.
    # No `expires` directive here on purpose: it emits its own Cache-Control,
    # which lands alongside the add_header one and sends the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # HTML should always revalidate so content edits go live immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/yuki-security-headers.conf;
    }

    # ---- never serve these -------------------------------------------
    # Belt and braces: the deploy script doesn't copy them, but if one
    # ever lands in the web root by hand it still won't be downloadable.
    location ~* \.(pem|key|ppk|py|md|sh|json|xml)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/yuki.access.log;
    error_log  /var/log/nginx/yuki.error.log;
}
