# Shared proxy headers for anything passed to the node backend.
# Installed to /etc/nginx/snippets/yuki-proxy.conf by server-setup.sh.
#
# X-Forwarded-Proto is load-bearing: express runs with `trust proxy` set, and
# uses this header to decide whether the connection is secure. Without it,
# secure session cookies are never sent and login silently fails over HTTPS.
#
# X-Forwarded-For matters for the same reason on rate limiting — without it
# express-rate-limit sees every request as coming from nginx's own address
# and the login limiter throttles all users as one bucket.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
